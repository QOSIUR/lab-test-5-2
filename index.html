<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка возраста</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f4f5;
    }
    form {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 320px;
      margin: 16px;
    }
    label { display: block; margin-bottom: 8px; }
    input, button { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; }
    button { margin-top: 12px; cursor: pointer; }
    .error { color: #c00; min-height: 1.2em; margin: 8px 0 0; font-size: 14px; }
  </style>
</head>
<body>
  <form id="age-form" novalidate>
    <label for="birth-date">Введите дату рождения</label>
    <input type="text" id="birth-date" placeholder="31.12.2020" autocomplete="bday">
    <p class="error" id="error" role="alert"></p>
    <button type="submit">Войти</button>
  </form>

  <script src="check.js"></script>
  <script>
    const form = document.getElementById('age-form');
    const input = document.getElementById('birth-date');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const result = resolveBirthDate(input.value, new Date());
      if (result.error) {
        errorEl.textContent = result.error;
        return;
      }
      window.location.href = result.url;
    });

    input.addEventListener('input', () => {
      errorEl.textContent = '';
    });
  </script>
</body>
</html>
